
name: Build RIWAQ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RIWAQ-Android-Studio-v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q RIWAQ-Android-Studio-v1.zip -d extracted
          ls -la extracted/riwaq-android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RIWAQ APK
        working-directory: extracted/riwaq-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIWAQ-APK
          path: extracted/riwaq-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
